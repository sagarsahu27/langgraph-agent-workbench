[project]
name = "langgraph-agent-workbench"
version = "0.1.0"
description = "Sample LangGraph agents for issue triage and project diagnostics across local and API model runtimes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.60",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agent-workbench = "agent_workbench.main:main"
agent-workbench-issue = "agent_workbench.github_issue_agent:main"
agent-workbench-pr-review = "agent_workbench.github_pr_agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
