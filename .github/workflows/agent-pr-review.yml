name: Agent PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
      model_provider:
        description: Model provider
        required: false
        default: ollama
        type: choice
        options:
          - ollama
          - openai
          - azure-openai
      model_name:
        description: Ollama model, OpenAI model, or Azure deployment
        required: false
        default: qwen3:4b
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: agent-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review-pr:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_PROVIDER: ${{ inputs.model_provider || vars.MODEL_PROVIDER || 'ollama' }}
      MODEL_NAME: ${{ inputs.model_name || vars.MODEL_NAME || 'qwen3:4b' }}
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_REASONING: ${{ vars.OLLAMA_REASONING || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-08-01-preview' }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent workbench
        run: python -m pip install -e .

      - name: Install Ollama and pull Qwen
        if: ${{ env.MODEL_PROVIDER == 'ollama' }}
        run: bash .github/scripts/setup-ollama.sh

      - name: Review pull request
        run: |
          python -m agent_workbench.github_pr_agent \
            --repo "${{ github.repository }}" \
            --pr-number "$PR_NUMBER" \
            --provider "$MODEL_PROVIDER" \
            --model "$MODEL_NAME"
